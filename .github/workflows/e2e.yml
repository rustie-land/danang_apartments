name: E2E / UI Tests (Asia Stays)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Smoke (Desktop Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: microsoft/playwright-github-action@v1
        with:
          with-deps: true
      - run: npm run test:e2e

  design-audit:
    name: Design System Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true  # fail = visual drift, not a build break
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: microsoft/playwright-github-action@v1
        with:
          with-deps: true
      - run: npm run test:design
