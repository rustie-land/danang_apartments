<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asia Stays — Long-term rentals across Asia</title>
    <meta
      name="description"
      content="Asia Stays is a fast way to browse private apartment and rental listings across Asia and contact owners directly. Search by area, price, and amenities on an interactive map."
    />
    <meta name="theme-color" content="#0d3c3e" />
    <link rel="canonical" href="https://danang-apartments.vercel.app/" />

    <!-- Open Graph (social previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Asia Stays" />
    <meta property="og:title" content="Asia Stays — Long-term rentals across Asia" />
    <meta
      property="og:description"
      content="Browse private rental listings across Asia and contact owners directly. Fast search by area, price, and amenities on a map."
    />
    <meta property="og:image" content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:url" content="https://danang-apartments.vercel.app/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asia Stays — Long-term rentals across Asia" />
    <meta
      name="twitter:description"
      content="Browse private rental listings across Asia and contact owners directly."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Asia Stays",
        "url": "https://danang-apartments.vercel.app/",
        "description": "Browse private rental listings across Asia and contact owners directly.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://danang-apartments.vercel.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
